# Render blueprint. Heads up: the free plan's disk is wiped on every deploy/restart,
# so uploads won't stick around there yet.
services:
  - type: web
    name: wisteria
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
